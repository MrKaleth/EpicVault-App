<div class="container mt-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-md-8"> 
      <div class="card shadow border-0">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">✨ Registrar Nuevo Usuario (Completo)</h4>
        </div>
        
        <div class="card-body"> 
          <form (ngSubmit)="crearUsuario()">
            
            <div class="row">
              <div class="col-md-6">
                <h5 class="text-success mb-3">Credenciales</h5>
                
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input type="text" class="form-control" [(ngModel)]="nuevoUsuario.username" name="username" required placeholder="Ej: DragonSlayer">
                </div>

                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" [(ngModel)]="nuevoUsuario.email" name="email" required placeholder="email@ejemplo.com">
                </div>

                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" class="form-control" [(ngModel)]="nuevoUsuario.password_hash" name="password" required placeholder="********">
                </div>
              </div>

              <div class="col-md-6">
                <h5 class="text-warning mb-3">Configuración Admin</h5>

                <div class="mb-3">
                  <label class="form-label">Avatar URL</label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="nuevoUsuario.avatar_url" name="avatar" placeholder="https://...">
                  <div class="mt-2 text-center" *ngIf="nuevoUsuario.avatar_url">
                    <img [src]="nuevoUsuario.avatar_url" class="rounded-circle shadow-sm" width="60" height="60" style="object-fit: cover;">
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Roles Globales</label>
                  <select class="form-select" [(ngModel)]="nuevoUsuario.global_roles" name="roles" multiple size="3">
                    <option value="USER">USER (Usuario Normal)</option>
                    <option value="ADMIN">ADMIN (Administrador)</option>
                    <option value="MODERATOR">MODERATOR (Moderador)</option>
                  </select>
                  <div class="form-text text-muted small">Mantén Ctrl (o Cmd) para seleccionar varios.</div>
                </div>

                <div class="mt-3 p-3 rounded d-flex align-items-center" 
                     style="background-color: var(--input-bg); border: 1px solid var(--input-border);">
                  
                  <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" id="verifiedCheck" 
                           [(ngModel)]="nuevoUsuario.verified" name="verified"
                           style="cursor: pointer;">
                    <label class="form-check-label fw-bold ms-2" for="verifiedCheck" 
                           style="color: var(--text-main); cursor: pointer;">
                      ¿Usuario Verificado?
                    </label>
                  </div>

                </div>
              </div>
            </div>

            <hr class="my-4" style="border-color: var(--input-border); opacity: 1;">

            <div class="d-flex justify-content-end gap-2">
              <a routerLink="/usuarios" class="btn btn-outline-secondary">Cancelar</a>
              <button type="submit" class="btn btn-success px-4">Guardar Usuario</button>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>
