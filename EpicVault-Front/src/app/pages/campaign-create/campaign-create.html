<div class="container mt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden"
                style="background-color: var(--bg-card); border: 1px solid var(--card-border) !important;">

                <div style="height: 6px; background: linear-gradient(90deg, var(--secondary), #6a11cb);"></div>

                <div class="card-body p-4 p-md-5">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <span class="fs-1">🗡️</span>
                        <div>
                            <h2 class="fw-bold mb-0" style="color: var(--secondary);">Forjar Campaña</h2>
                            <p class="mb-0" style="color: var(--text-muted);">Inicia una nueva aventura como Dungeon
                                Master.</p>
                        </div>
                    </div>

                    @if (errorMessage) {
                    <div class="alert alert-danger shadow-sm border-0"
                        style="background-color: rgba(220, 53, 69, 0.1); color: #ff6b6b;">
                        ⚠️ {{ errorMessage }}
                    </div>
                    }

                    <form (ngSubmit)="crearCampana()">

                        <div class="mb-4 text-center">
                            @if (imagePreview) {
                            <img [src]="imagePreview" class="img-fluid rounded-4 mb-3 shadow"
                                style="max-height: 200px; object-fit: cover; width: 100%;">
                            }
                            <label class="btn btn-outline-secondary w-100" style="border-style: dashed;">
                                📷 Subir Portada de Campaña
                                <input type="file" class="d-none" (change)="onFileSelected($event)" accept="image/*">
                            </label>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase"
                                style="color: var(--text-muted);">Nombre de la Aventura *</label>
                            <input type="text" class="form-control form-control-lg border-0 shadow-none"
                                style="background-color: var(--input-bg); color: var(--text-main);"
                                [(ngModel)]="campaignData.name" name="name" placeholder="Ej: Las Minas de Phandelver"
                                required>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold small text-uppercase"
                                style="color: var(--text-muted);">Descripción o Sinopsis</label>
                            <textarea class="form-control border-0 shadow-none"
                                style="background-color: var(--input-bg); color: var(--text-main); resize: none;"
                                [(ngModel)]="campaignData.description" name="description" rows="4"
                                placeholder="Cuenta brevemente de qué va esta historia..."></textarea>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="button" class="btn btn-outline-secondary btn-lg flex-grow-1"
                                routerLink="/campanas" [disabled]="isSubmitting">Cancelar</button>
                            <button type="submit" class="btn btn-primary btn-lg flex-grow-1 fw-bold shadow-sm"
                                [disabled]="isSubmitting">
                                @if (isSubmitting) { <span class="spinner-border spinner-border-sm me-2"></span> } @else
                                { Crear Partida }
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
