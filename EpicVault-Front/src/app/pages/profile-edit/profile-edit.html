<div class="container mt-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div *ngIf="mensajeError()"
        class="alert alert-danger shadow-sm border-0 mb-4 text-center fw-bold animate__animated animate__headShake"
        style="border-radius: 12px; background-color: rgba(220, 53, 69, 0.1); color: #dc3545;">
        ❌ {{ mensajeError() }}
      </div>

      <div class="card shadow-lg border-0 overflow-hidden"
        style="background-color: var(--bg-card); border: 1px solid var(--card-border) !important; border-radius: 20px;">

        <div style="height: 10px; background: linear-gradient(90deg, var(--secondary), #6a11cb);"></div>

        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: var(--text-main);">📝 Forja tu Identidad</h3>
            <p style="color: var(--text-muted);">Modifica los datos de tu ficha de aventurero.</p>
          </div>

          <form (ngSubmit)="guardarCambios()">

            <div class="mb-4 text-center">
              <div class="position-relative d-inline-block mb-3">
                <img
                  [src]="imagePreview || userEdicion.avatar_url || 'https://ui-avatars.com/api/?name=' + userEdicion.username"
                  class="rounded-circle shadow-lg" width="150" height="150"
                  style="object-fit: cover; border: 5px solid var(--secondary); background: var(--input-bg); padding: 5px;">

                <label for="avatarInput"
                  class="btn btn-primary position-absolute bottom-0 end-0 rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                  style="width: 45px; height: 45px; border: 4px solid var(--bg-card); cursor: pointer; transition: transform 0.2s;"
                  title="Cambiar foto" onmouseover="this.style.transform='scale(1.1)'"
                  onmouseout="this.style.transform='scale(1)'">
                  📷
                  <input type="file" id="avatarInput" class="d-none" (change)="onFileSelected($event)" accept="image/*">
                </label>
              </div>
              <p class="small fw-medium" style="color: var(--text-muted);">Haz clic en la cámara para subir un nuevo
                avatar</p>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold small text-uppercase" style="color: var(--text-muted);">Nombre de
                Usuario</label>
              <input type="text" class="form-control border-0 p-3 shadow-sm rounded-3"
                style="background-color: var(--input-bg); color: var(--text-main);" [(ngModel)]="userEdicion.username"
                name="username" required>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold small text-uppercase" style="color: var(--text-muted);">Email</label>
              <input type="email" class="form-control border-0 p-3 shadow-sm rounded-3"
                style="background-color: var(--input-bg); color: var(--text-main);" [(ngModel)]="userEdicion.email"
                name="email" required>
            </div>

            <div class="mb-5 p-3 rounded-4"
              style="background-color: var(--table-head-bg); border: 1px dashed var(--secondary);">
              <label class="form-label fw-bold text-uppercase small d-block text-center"
                style="color: var(--text-muted);">Código de Gremio (Inmutable)</label>
              <input type="text" class="form-control border-0 p-2 fw-bold text-center fs-5"
                style="background-color: transparent; color: var(--secondary); letter-spacing: 2px;"
                [value]="userEdicion.friend_code" readonly disabled>
              <div class="text-center mt-2">
                <small style="color: var(--text-muted); font-size: 0.8rem;">Este código es único y te identifica ante
                  otros aventureros.</small>
              </div>
            </div>

            <div class="d-flex flex-column flex-sm-row gap-3 mt-4">
              <a routerLink="/perfil" class="btn border-0 py-3 w-100 fw-bold shadow-sm rounded-3"
                style="background-color: var(--input-bg); color: var(--text-main);">
                Cancelar
              </a>
              <button type="submit" class="btn btn-primary py-3 w-100 fw-bold shadow-sm rounded-3"
                [disabled]="guardando()">
                {{ guardando() ? 'Forjando...' : 'Guardar Cambios' }}
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
